<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNI Nouveau Logo</title>
<style>
  @font-face { font-family: "Montserrat"; font-weight: 400; src: url(assets/fonts/montserrat-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 500; src: url(assets/fonts/montserrat-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 700; src: url(assets/fonts/montserrat-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 800; src: url(assets/fonts/montserrat-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "Allison"; font-weight: 400; src: url(assets/fonts/allison-latin-400-normal.woff2) format("woff2"); }

  /* Charte V4 : bleu #2F4A71 (≈60 %), blanc / ivoire (≈30 %), doré #D9AE57 en accent (≈10 %) */
  :root {
    --bleu: #2F4A71;
    --bleu-fonce: #1F314D;
    --or: #D9AE57;
    --blanc: #FFFFFF;
    --ivoire: #E5DFCC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0f1724; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif; }

  /* Scène 1080×1920 (Reel 9:16). Zones de sécurité charte : 250 px en haut, 350 px en bas. */
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--blanc); transform-origin: center center; flex: none; }
  body.render { display: block; background: var(--blanc); }
  body.render #stage { transform: none !important; }

  .layer { position: absolute; inset: 0; background: var(--blanc); }
  .abs { position: absolute; }

  /* Bloc-marque : fichier officiel découpé en 3 calques superposés (jamais redessiné) */
  .gni { position: absolute; aspect-ratio: 1033 / 565; }
  .gni img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .gni .filet { transform-origin: center center; }

  /* Ancien logo (fichier fourni) ou cadre provisoire */
  .old { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .old img { display: block; width: 100%; height: auto; }
  .ph-logo { width: 100%; aspect-ratio: 2 / 1; border: 4px dashed rgba(47,74,113,.55); color: var(--bleu);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    font-weight: 700; font-size: 38px; text-align: center; }
  .ph-logo small { font-weight: 500; font-size: 22px; opacity: .65; }

  /* Flash-back */
  .shot { position: absolute; inset: 0; overflow: hidden; background: var(--bleu-fonce); }
  .shot img, .shot .ph-photo { position: absolute; inset: -5%; width: 110%; height: 110%; object-fit: cover; }
  .ph-photo { display: flex; align-items: flex-start; justify-content: flex-start; padding: 330px 90px; text-align: left;
    color: rgba(255,255,255,.22); font-weight: 800; font-size: 64px; line-height: 1.05; letter-spacing: -.01em;
    background: #2a4266; }
  .ph-photo span { display: block; font-weight: 500; font-size: 26px; margin-top: 18px; letter-spacing: 0; }
  /* Dégradé bleu en bas uniquement (règle charte : jamais de voile sur toute la photo) */
  .shot .degrade { position: absolute; left: 0; right: 0; bottom: 0; height: 62%;
    background: linear-gradient(to top, rgba(31,49,77,.92) 0%, rgba(31,49,77,.75) 38%, rgba(31,49,77,0) 100%); }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .09; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

  /* Typographie */
  .t { font-weight: 800; line-height: .98; letter-spacing: -.025em; }
  .txt { font-weight: 500; font-size: 42px; line-height: 1.28; }
  .filetV { position: absolute; width: 10px; background: var(--or); transform-origin: center top; }
  .sign { font-family: "Allison", cursive; font-weight: 400; line-height: 1; }

  /* Lecteur (masqué au rendu vidéo) */
  #ctrl { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
    background: rgba(0,0,0,.65); color: #fff; padding: 8px 14px; border-radius: 8px; font: 500 13px "Montserrat", sans-serif; z-index: 10; }
  #ctrl button { font: inherit; padding: 4px 10px; cursor: pointer; }
  #ctrl input { width: 260px; }
  body.render #ctrl { display: none; }
</style>
</head>
<body>
<div id="stage">

  <!-- 1 · L'ancien logo -->
  <div class="layer" id="s1">
    <div class="old" id="oldLogo1" style="width:620px; top:40%"></div>
    <div class="filetV" id="s1filet" style="left:110px; top:1090px; height:345px"></div>
    <div class="abs t" id="s1a" style="left:150px; top:1080px; color:var(--bleu); font-size:84px; line-height:1.02">Des agences<br>indépendantes<br>réunies pour<br>collaborer</div>
  </div>

  <!-- 2 · Flash-back : conventions, rencontres -->
  <div class="layer" id="s2">
    <div id="shots"></div>
    <div class="grain"></div>
    <div class="filetV" id="s2filet" style="left:90px; top:1250px; height:250px"></div>
    <div id="s2words"></div>
  </div>

  <!-- 3 · Bientôt 20 ans -->
  <div class="layer" id="s3" style="background:var(--bleu)">
    <div class="abs t" id="s3num" style="left:60px; top:250px; font-size:780px; color:var(--blanc); letter-spacing:-.07em">20</div>
    <div class="filetV" id="s3filet" style="left:110px; top:1125px; height:300px"></div>
    <div class="abs t" id="s3ans" style="left:150px; top:1115px; font-size:140px; color:var(--blanc)">ans,</div>
    <div class="abs t" id="s3bientot" style="left:150px; top:1255px; font-size:140px; color:var(--or)">bientôt.</div>
    <div class="abs txt" id="s3evol" style="left:152px; top:1470px; color:var(--blanc)">Et le Groupe évolue.</div>
  </div>

  <!-- 4 · Passage de relais : ancien → nouveau logo -->
  <div class="layer" id="s4">
    <div class="old" id="oldLogo2" style="width:620px; top:44%"></div>
    <div class="gni" id="logoA" style="width:820px; left:130px; top:620px">
      <img class="filet" src="assets/medias/logo-filet.png" alt="">
      <img class="texte" src="assets/medias/logo-texte-bleu.png" alt="">
      <img class="barre" src="assets/medias/logo-barre.png" alt="">
    </div>
    <div class="abs" id="wipe" style="inset:0; background:var(--bleu)"></div>
    <div class="abs txt" id="s4txt" style="left:0; width:1080px; text-align:center; top:1290px; color:var(--bleu); font-weight:700">Notre nouvelle identité.</div>
  </div>

  <!-- 5 · Le groupement + le réseau sous licence de marque -->
  <div class="layer" id="s5" style="background:var(--bleu)">
    <div class="filetV" id="s5filetA" style="left:110px; top:410px; height:300px"></div>
    <div class="abs t" id="s5a" style="left:150px; top:400px; font-size:108px; color:var(--blanc); white-space:nowrap">Le groupement<br>demeure.</div>
    <div class="abs txt" id="s5a2" style="left:152px; top:640px; color:var(--blanc); opacity:.8; font-size:36px"></div>
    <div class="abs t" id="s5plus" style="left:128px; top:700px; font-size:230px; color:var(--or); font-weight:700; transform-origin:30% 60%">+</div>
    <div class="filetV" id="s5filetB" style="left:110px; top:1010px; height:310px"></div>
    <div class="abs t" id="s5b" style="left:150px; top:1000px; font-size:108px; color:var(--blanc); white-space:nowrap">un réseau<br>sous <span style="color:var(--or)">licence</span><br>de marque.</div>
    <div class="abs txt" id="s5c" style="left:152px; top:1360px; color:var(--blanc); font-size:36px"></div>
  </div>

  <!-- 6 · Carton de fin -->
  <div class="layer" id="s6">
    <div class="gni" id="logoB" style="width:760px; left:160px; top:520px">
      <img class="filet" src="assets/medias/logo-filet.png" alt="">
      <img class="texte" src="assets/medias/logo-texte-bleu.png" alt="">
      <img class="barre" src="assets/medias/logo-barre.png" alt="">
    </div>
    <div class="abs sign" id="s6sign" style="left:0; width:1080px; text-align:center; top:1060px; font-size:150px; color:var(--bleu)">Plus fortes ensemble.</div>
    <div class="abs txt" id="s6txt" style="left:0; width:1080px; text-align:center; top:1290px; color:var(--bleu); font-weight:700; font-size:40px"></div>
    <div class="abs txt" id="s6url" style="left:0; width:1080px; text-align:center; top:1440px; color:var(--bleu); font-size:32px"></div>
  </div>

  <div id="flash"></div>
</div>

<div id="ctrl">
  <button id="play">⏸</button>
  <input id="scrub" type="range" min="0" max="30" step="0.01" value="0">
  <span id="tc">0.0 s</span>
</div>

<script>
/* ======================================================================
   CONFIGURATION — textes et médias modifiables sans toucher au reste.
   Déposez vos fichiers dans assets/medias/ avec ces noms (ou changez-les).
   Tant qu'un fichier manque, un cadre « à remplacer » s'affiche.
   ====================================================================== */
const CONFIG = {
  ancienLogo: "assets/medias/ancien-logo.png",      // PNG fond transparent
  flashbacks: [                                        // photos verticales d'événements réels
    { src: "assets/medias/flashback-1.jpg", label: "Photo convention" },
    { src: "assets/medias/flashback-2.jpg", label: "Photo rencontre / réunion de secteur" },
    { src: "assets/medias/flashback-3.jpg", label: "Photo scène / remise de prix" },
    { src: "assets/medias/flashback-4.jpg", label: "Photo agence du réseau" },
    { src: "assets/medias/flashback-5.jpg", label: "Photo de groupe convention" },
  ],
  phrases: [
    "Des conventions.",
    "Des rencontres.",
    "Des réussites partagées.",
    "Près de 450 agences partenaires.",
    "Un même collectif.",
  ],
  groupementPrecision: "Les agences partenaires en restent membres.",
  reseauPrecision: "Lancement en 2026.",
  finTexte: "Bientôt 20 ans. Une nouvelle page.",
  siteWeb: "groupenationalimmobilier.fr",
};
const DURATION = 30;

/* ---------- Outils d'animation ---------- */
const $ = id => document.getElementById(id);
const clamp = v => Math.max(0, Math.min(1, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eOutBack = x => { const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const win = (t, a, b, fi = .3, fo = .3) => (t < a || t > b) ? 0 : Math.min(fi ? seg(t, a, a + fi) : 1, fo ? 1 - seg(t, b - fo, b) : 1);
function set(el, o, tf) { el.style.opacity = o; if (tf !== undefined) el.style.transform = tf; }
function rise(el, t, a, d = .6, dist = 50) { const p = eOut(seg(t, a, a + d)); set(el, p, `translateY(${(1 - p) * dist}px)`); }
function drop(el, t, a, d = .6) { el.style.transform = `scaleY(${eOutExpo(seg(t, a, a + d))})`; }

/* Montage du bloc-marque : filet qui se trace, texte révélé depuis le filet,
   puis la barre dorée glisse dans le G (la clé dans la serrure). */
function assembleLogo(box, t, a) {
  const [filet, texte, barre] = box.children;
  const pf = eInOut(seg(t, a, a + .6));
  filet.style.transform = `scaleY(${pf})`; filet.style.opacity = pf > 0 ? 1 : 0;
  const pt = eOut(seg(t, a + .45, a + 1.25));
  texte.style.clipPath = `inset(0 ${(1 - pt) * 100}% 0 0)`;
  texte.style.transform = `translateX(${(1 - pt) * -40}px)`;
  const pb = seg(t, a + 1.25, a + 1.85);
  barre.style.opacity = Math.min(1, pb * 4);
  barre.style.transform = `translateX(${(1 - eOutBack(pb)) * -220}px)`;
}

/* ---------- Médias ---------- */
function oldLogoInto(id) {
  const box = $(id), img = new Image();
  return new Promise(res => {
    img.onload = () => { box.innerHTML = ""; box.appendChild(img); res(); };
    img.onerror = () => { box.innerHTML = `<div class="ph-logo">ANCIEN LOGO<small>à déposer : ${CONFIG.ancienLogo}</small></div>`; res(); };
    img.src = CONFIG.ancienLogo;
  });
}
function buildShots() {
  const wrap = $("shots"), words = $("s2words");
  return Promise.all(CONFIG.flashbacks.map((f, i) => {
    const shot = document.createElement("div"); shot.className = "shot"; shot.id = "shot" + i; wrap.appendChild(shot);
    const w = document.createElement("div"); w.className = "abs t"; w.id = "word" + i;
    w.style.cssText = "left:130px; top:1255px; width:880px; font-size:100px; color:#fff;";
    w.textContent = CONFIG.phrases[i] || ""; words.appendChild(w);
    return new Promise(res => {
      const img = new Image();
      const finish = el => { shot.prepend(el); const d = document.createElement("div"); d.className = "degrade"; shot.appendChild(d); res(); };
      img.onload = () => finish(img);
      img.onerror = () => { const d = document.createElement("div"); d.className = "ph-photo"; d.innerHTML = `${f.label}<span>à déposer : ${f.src}</span>`; finish(d); };
      img.src = f.src;
    });
  }));
}
function imgsLoaded() {
  return Promise.all([...document.querySelectorAll(".gni img")].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
}

/* ---------- Timeline (secondes) ---------- */
const T = { s1: [0, 3.9], s2: [3.7, 12.7], s3: [12.5, 17.0], s4: [16.8, 22.6], s5: [22.4, 27.4], s6: [27.2, 30.0] };

function render(t) {
  // 1 — l'ancien logo, sur blanc
  $("s1").style.opacity = win(t, ...T.s1, 0, 0);
  { const p = eOut(seg(t, .15, 1.3)); set($("oldLogo1"), p, `translate(-50%,-50%) scale(${.94 + .06 * p})`); }
  drop($("s1filet"), t, 1.3, .6);
  rise($("s1a"), t, 1.4, .7);

  // 2 — flash-back : plans de 1,8 s, léger zoom, flash blanc à chaque coupe
  $("s2").style.opacity = win(t, ...T.s2, .2, 0);
  const n = CONFIG.flashbacks.length, len = (T.s2[1] - T.s2[0]) / n;
  let flash = 0;
  for (let i = 0; i < n; i++) {
    const a = T.s2[0] + i * len, b = a + len;
    const on = t >= a && (t < b || i === n - 1);
    const k = seg(t, a, b + .3), sc = 1.03 + .07 * k, dx = (i % 2 ? -1 : 1) * 20 * k;
    const shot = $("shot" + i); shot.style.opacity = on ? 1 : 0;
    if (shot.firstElementChild) shot.firstElementChild.style.transform = `translateX(${dx}px) scale(${sc})`;
    const w = $("word" + i);
    if (on) { const p = eOut(seg(t, a + .08, a + .5)); set(w, p, `translateY(${(1 - p) * 36}px)`); } else w.style.opacity = 0;
    if (i > 0 && t >= a) flash = Math.max(flash, 1 - seg(t, a, a + .18));
  }
  drop($("s2filet"), t, T.s2[0] + .15, .5);
  $("flash").style.opacity = (t > T.s2[0] && t < T.s2[1]) ? flash * .8 : 0;

  // 3 — 20 ans, bientôt
  $("s3").style.opacity = win(t, ...T.s3, .2, 0);
  { const p = eOutExpo(seg(t, 12.6, 13.8)); set($("s3num"), p, `translateY(${(1 - p) * 140}px) scale(${1.12 - .12 * p})`); }
  drop($("s3filet"), t, 13.4, .6);
  rise($("s3ans"), t, 13.5, .6);
  rise($("s3bientot"), t, 13.85, .6);
  rise($("s3evol"), t, 15.0, .7, 30);

  // 4 — passage de relais : volet bleu, puis assemblage du nouveau bloc-marque
  $("s4").style.opacity = win(t, ...T.s4, .2, 0);
  { const p = eOut(seg(t, 16.9, 17.6)); set($("oldLogo2"), p * (t < 18.75 ? 1 : 0), `translate(-50%,-50%) scale(${.97 + .03 * p})`); }
  { const wIn = eInOut(seg(t, 18.1, 18.75)), wOut = eInOut(seg(t, 18.85, 19.5)), w = $("wipe");
    w.style.transformOrigin = wOut > 0 ? "center top" : "center bottom";
    w.style.transform = `scaleY(${wOut > 0 ? 1 - wOut : wIn})`; }
  $("logoA").style.visibility = t >= 18.8 ? "visible" : "hidden";
  assembleLogo($("logoA"), t, 19.3);
  rise($("s4txt"), t, 21.0, .7, 30);

  // 5 — le groupement + un réseau sous licence de marque
  $("s5").style.opacity = win(t, ...T.s5, .2, 0);
  drop($("s5filetA"), t, 22.5, .5);
  rise($("s5a"), t, 22.6, .7);
  rise($("s5a2"), t, 23.1, .6, 20);
  { const p = eOutExpo(seg(t, 23.9, 24.5)); set($("s5plus"), p, `scale(${.3 + .7 * p})`); }
  drop($("s5filetB"), t, 24.3, .5);
  rise($("s5b"), t, 24.4, .7);
  rise($("s5c"), t, 25.4, .6, 20);

  // 6 — carton de fin : logo, signature, un seul appel à l'action
  $("s6").style.opacity = win(t, T.s6[0], T.s6[1] + 1, .2, 0);
  assembleLogo($("logoB"), t, 27.3);
  { const p = eOut(seg(t, 28.5, 29.3)); $("s6sign").style.opacity = p; $("s6sign").style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`; }
  rise($("s6txt"), t, 28.8, .6, 20);
  rise($("s6url"), t, 29.1, .6, 20);
}

/* ---------- Initialisation ---------- */
$("s5a2").textContent = CONFIG.groupementPrecision;
$("s5c").textContent = CONFIG.reseauPrecision;
$("s6txt").textContent = CONFIG.finTexte;
$("s6url").textContent = CONFIG.siteWeb;
window.ready = Promise.all([
  ...["800", "700", "500"].map(w => document.fonts.load(`${w} 100px "Montserrat"`)),
  document.fonts.load('400 100px "Allison"'),
  oldLogoInto("oldLogo1"), oldLogoInto("oldLogo2"), buildShots(), imgsLoaded(),
]).then(() => document.fonts.ready);
window.render = render;

if (new URLSearchParams(location.search).has("render")) {
  document.body.classList.add("render");
} else {
  const fit = () => { const s = Math.min(innerWidth / 1080, (innerHeight - 60) / 1920); $("stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  let playing = true, t0 = performance.now(), cur = 0;
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "⏸" : "▶"; t0 = performance.now() - cur * 1000; };
  $("scrub").oninput = e => { cur = +e.target.value; t0 = performance.now() - cur * 1000; };
  window.ready.then(() => {
    const loop = now => {
      if (playing) { cur = ((now - t0) / 1000) % DURATION; $("scrub").value = cur; }
      $("tc").textContent = cur.toFixed(1) + " s"; render(cur); requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
