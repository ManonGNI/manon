<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNI Nouveau Logo</title>
<style>
  @font-face { font-family: "Montserrat"; font-weight: 500; src: url(assets/fonts/montserrat-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 700; src: url(assets/fonts/montserrat-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 800; src: url(assets/fonts/montserrat-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "Allison"; font-weight: 400; src: url(assets/fonts/allison-latin-400-normal.woff2) format("woff2"); }

  /* Charte V4 : bleu #2F4A71 (≈60 %), blanc (≈30 %), doré #D9AE57 en accent (≈10 %) */
  :root { --bleu: #2F4A71; --bleu-fonce: #1F314D; --or: #D9AE57; --blanc: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0f1724; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif; }

  /* Scène 1080×1920 (Reel 9:16). Zones de sécurité charte : 250 px en haut, 350 px en bas. */
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bleu); transform-origin: center center; flex: none; }
  #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  body.render { display: block; background: var(--bleu); }
  body.render #stage { transform: none !important; }

  .layer { position: absolute; inset: 0; overflow: hidden; }
  .blanc { background: var(--blanc); }
  .bleu { background: var(--bleu); }
  .abs { position: absolute; }

  /* Texte cinétique : chaque mot monte depuis un masque de ligne */
  .k { font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .k .ln { display: block; overflow: hidden; padding: .06em 0 .12em; margin: -.06em 0 -.12em; }
  .k .w { display: inline-block; will-change: transform; }
  .k .or { color: var(--or); }
  .filetV { position: absolute; width: 10px; background: var(--or); transform-origin: center top; }
  .sign { font-family: "Allison", cursive; font-weight: 400; line-height: 1; }

  /* Bloc-marque : fichier officiel découpé en 3 calques (jamais redessiné) */
  .gni { position: absolute; aspect-ratio: 1033 / 565; }
  .gni img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .gni .filet { transform-origin: center center; }
  .old { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .old img { display: block; width: 100%; height: auto; }

  /* Mur de photos : vignettes au format d'origine 3:2, donc nettes */
  .row { position: absolute; left: 0; height: 360px; width: 10000px; }
  .tile { position: absolute; top: 0; width: 540px; height: 360px; background-repeat: no-repeat; background-color: var(--bleu-fonce); }
  #band { position: absolute; left: 0; width: 1080px; top: 735px; height: 450px; background: var(--bleu); transform-origin: center; }

  /* « 20 » rempli de photos */
  #num20 { position: absolute; left: 30px; top: 300px; font-weight: 800; font-size: 840px; line-height: .86; letter-spacing: -.07em;
    color: transparent; -webkit-background-clip: text; background-clip: text; background-size: cover; background-position: center; padding: 0 20px; }

  .bar { position: absolute; left: 0; width: 1080px; transform: scaleX(0); }
  #ctrl { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
    background: rgba(0,0,0,.65); color: #fff; padding: 8px 14px; border-radius: 8px; font: 500 13px "Montserrat", sans-serif; z-index: 10; }
  #ctrl button { font: inherit; padding: 4px 10px; cursor: pointer; }
  #ctrl input { width: 260px; }
  body.render #ctrl { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="cam">

  <!-- 3 · « 20 » rempli de photos (sous le mur, révélé quand il s'envole) -->
  <div class="layer bleu" id="s3">
    <div id="num20">20</div>
    <div class="filetV" id="s3filet" style="left:110px; top:1110px; height:310px"></div>
    <div class="abs k" id="s3a" style="left:150px; top:1100px; font-size:150px; color:var(--blanc)"></div>
    <div class="abs k" id="s3b" style="left:152px; top:1465px; font-size:44px; font-weight:500; letter-spacing:0; color:var(--blanc)"></div>
  </div>

  <!-- 2 · Mur de souvenirs -->
  <div class="layer" id="s2">
    <div id="wall" class="layer" style="transform-origin:50% 50%"></div>
    <div id="band">
      <div class="filetV" id="s2filet" style="left:110px; top:70px; height:310px"></div>
      <div id="s2words"></div>
    </div>
  </div>

  <!-- 1 · 2007, l'ancien logo -->
  <div class="layer blanc" id="s1">
    <div class="old" id="oldLogo1" style="width:800px; top:38%"></div>
    <div class="filetV" id="s1filet" style="left:110px; top:1110px; height:250px"></div>
    <div class="abs k" id="s1a" style="left:150px; top:1100px; font-size:150px; color:var(--bleu)"></div>
    <div class="abs k" id="s1b" style="left:152px; top:1265px; font-size:44px; font-weight:500; letter-spacing:0; line-height:1.25; color:var(--bleu)"></div>
  </div>

  <!-- 4 · Ancien → nouveau logo (ouverture en iris depuis le « 0 ») -->
  <div class="layer blanc" id="s4">
    <div class="old" id="oldLogo2" style="width:800px; top:46%"></div>
    <div class="gni" id="logoA" style="width:820px; left:130px; top:640px">
      <img class="filet" src="assets/medias/logo-filet.png" alt="">
      <img class="texte" src="assets/medias/logo-texte-bleu.png" alt="">
      <img class="barre" src="assets/medias/logo-barre.png" alt="">
    </div>
    <div class="abs" id="goldLine" style="left:135px; width:9px; background:var(--or); top:0; height:1920px; transform-origin:center top"></div>
    <div class="abs k" id="s4txt" style="left:0; width:1080px; text-align:center; top:1310px; font-size:46px; font-weight:700; letter-spacing:0; color:var(--bleu)"></div>
  </div>

  <!-- 5 · Le groupement demeure et un réseau se lance -->
  <div class="layer bleu" id="s5">
    <div class="abs k" id="s5a" style="left:90px; top:300px; font-size:104px; color:var(--blanc); white-space:nowrap"></div>
    <div class="abs" id="s5photo" style="left:0; top:590px; width:1080px; height:720px; overflow:hidden">
      <div class="abs" id="s5img" style="inset:0; background-size:cover; background-position:center"></div>
    </div>
    <div class="abs k" id="s5b" style="left:90px; top:1350px; font-size:100px; color:var(--blanc); white-space:nowrap"></div>
  </div>

  <!-- 6 · Carton de fin -->
  <div class="layer blanc" id="s6">
    <div class="gni" id="logoB" style="width:760px; left:160px; top:520px">
      <img class="filet" src="assets/medias/logo-filet.png" alt="">
      <img class="texte" src="assets/medias/logo-texte-bleu.png" alt="">
      <img class="barre" src="assets/medias/logo-barre.png" alt="">
    </div>
    <div class="abs sign" id="s6sign" style="left:0; width:1080px; text-align:center; top:1060px; font-size:150px; color:var(--bleu)">Plus fortes ensemble.</div>
    <div class="abs k" id="s6txt" style="left:0; width:1080px; text-align:center; top:1290px; font-size:40px; font-weight:700; letter-spacing:0; color:var(--bleu)"></div>
    <div class="abs" id="s6url" style="left:0; width:1080px; text-align:center; top:1440px; color:var(--bleu); font-weight:500; font-size:32px"></div>
  </div>

  <div id="bars"></div>
</div></div>

<div id="ctrl">
  <button id="play">⏸</button>
  <input id="scrub" type="range" min="0" max="30" step="0.01" value="0">
  <span id="tc">0.0 s</span>
</div>

<script>
/* ======================================================================
   CONFIGURATION — textes et médias modifiables sans toucher au reste.
   Dans les textes : « | » = retour à la ligne, *mot* = mot en doré.
   ====================================================================== */
const CONFIG = {
  ancienLogo: "assets/medias/ancien-logo.png",
  photos: [
    "assets/medias/flashback-1.jpg", // convention
    "assets/medias/flashback-2.jpg", // cocktail en terrasse
    "assets/medias/flashback-3.jpg", // photobooth
    "assets/medias/flashback-4.jpg", // soirée dansante
    "assets/medias/flashback-5.jpg", // photo de groupe
  ],
  // vignettes du mur : [photo, zoom, cadrage X %, cadrage Y %]
  vignettes: [
    [0, 1, 50, 50], [4, 2, 22, 40], [2, 1.8, 42, 30], [3, 1, 50, 50], [1, 1, 50, 50], [0, 2.6, 96, 52],
    [4, 1, 50, 50], [2, 2.2, 62, 66], [1, 2, 45, 62], [3, 2, 50, 78], [0, 2, 14, 62], [4, 2, 80, 40],
    [2, 1, 50, 50], [1, 2.4, 60, 88], [3, 2.6, 95, 45], [4, 2, 50, 55],
  ],
  ouverture: { annee: "2007.", phrase: "Des agences indépendantes|réunies pour collaborer" },
  phrases: [
    "Des|conventions.",
    "Des|rencontres.",
    "Des réussites|partagées.",
    "Près de *450*|agences|partenaires.",
    "Un même|collectif.",
  ],
  vingtAns: { titre: "ans,|*bientôt.*", suite: "Et le Groupe évolue." },
  identite: "Notre nouvelle identité.",
  reseau: { a: "Le groupement|demeure", b: "et un réseau|*se lance*", photoA: 0, photoB: 4 },
  finTexte: "Bientôt 20 ans. Une nouvelle page.",
  siteWeb: "groupenationalimmobilier.fr",
};
const DURATION = 30;

/* ---------- Outils ---------- */
const $ = id => document.getElementById(id);
const clamp = v => Math.max(0, Math.min(1, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eOutBack = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const show = (el, on) => { el.style.display = on ? "" : "none"; };
const drop = (el, t, a, d = .45) => { el.style.transform = `scaleY(${eOutExpo(seg(t, a, a + d))})`; };
const url = i => `url("${CONFIG.photos[i]}")`;

function kin(el, text) {
  let gold = false;   // *…* peut couvrir plusieurs mots
  el.innerHTML = text.split("|").map(line =>
    `<span class="ln">${line.split(" ").map(w => {
      const open = w.startsWith("*"), close = w.endsWith("*"); if (open) gold = true;
      const html = `<span class="w${gold ? " or" : ""}">${w.replace(/\*/g, "")}</span>`; if (close) gold = false; return html;
    }).join(" ")}</span>`
  ).join("");
  el._w = [...el.querySelectorAll(".w")];
}
function words(el, t, a, b = Infinity, st = .06, d = .5) {
  el._w.forEach((w, j) => {
    const p = eOutExpo(seg(t, a + j * st, a + j * st + d));
    const q = b === Infinity ? 0 : eIn(seg(t, b + j * .03, b + j * .03 + .28));
    w.style.transform = `translateY(${(1 - p) * 115 - q * 115}%)`;
  });
}

/* Coups de caméra sur les temps forts */
const HITS = [0.15, 1.0, 11.15, 18.3, 23.45, 27.5];
function camera(t) {
  let s = 0; for (const h of HITS) if (t >= h) s += .04 * Math.exp(-(t - h) * 7);
  $("cam").style.transform = `scale(${1 + s})`;
}

/* Transition par bandes */
const BARS = [[20.9, "var(--bleu)"], [26.0, "var(--blanc)"]];
function bars(t) {
  const els = $("bars").children, cur = BARS.find(([a]) => t >= a - .01 && t < a + 1.1);
  for (let i = 0; i < els.length; i++) {
    const b = els[i];
    if (!cur) { b.style.transform = "scaleX(0)"; continue; }
    const [a, col] = cur; b.style.background = col;
    const p = eInOut(seg(t, a + i * .05, a + i * .05 + .32)), q = eInOut(seg(t, a + .5 + i * .05, a + .5 + i * .05 + .32));
    b.style.transformOrigin = q > 0 ? "right center" : "left center";
    b.style.transform = `scaleX(${q > 0 ? 1 - q : p})`;
  }
}

function assembleLogo(box, t, a, k = 1) {
  const [filet, texte, barre] = box.children;
  const pf = eInOut(seg(t, a, a + .45 * k));
  filet.style.transform = `scaleY(${pf})`; filet.style.opacity = pf > 0 ? 1 : 0;
  const pt = eOutExpo(seg(t, a + .3 * k, a + 1.0 * k));
  texte.style.clipPath = `inset(0 ${(1 - pt) * 100}% 0 0)`;
  texte.style.transform = `translateX(${(1 - pt) * -60}px)`;
  const pb = seg(t, a + 1.0 * k, a + 1.5 * k);
  barre.style.opacity = Math.min(1, pb * 4);
  barre.style.transform = `translateX(${(1 - eOutBack(pb)) * -240}px)`;
}

/* ---------- Construction ---------- */
const ROWS = 5, PER = 8, PITCH = 560;           // 5 rangées, 8 vignettes par cycle
const PH_T = [3.45, 4.9, 6.35, 7.8, 9.25];        // changements de phrase
function buildWall() {
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement("div"); row.className = "row"; row.id = "row" + r;
    row.style.top = (-10 + r * 385) + "px";
    for (let k = 0; k < PER * 2; k++) {
      const [p, z, x, y] = CONFIG.vignettes[(r * 5 + k) % CONFIG.vignettes.length];
      const tile = document.createElement("div"); tile.className = "tile";
      tile.style.left = (k * PITCH) + "px";
      tile.style.backgroundImage = url(p); tile.style.backgroundSize = `${z * 100}% auto`; tile.style.backgroundPosition = `${x}% ${y}%`;
      row.appendChild(tile);
    }
    $("wall").appendChild(row);
  }
  CONFIG.phrases.forEach((txt, i) => {
    const w = document.createElement("div"); w.className = "abs k"; w.id = "word" + i;
    w.style.cssText = "left:150px; top:60px; width:900px; font-size:104px; color:#fff;";
    $("s2words").appendChild(w); kin(w, txt);
  });
}
function preload() {
  return Promise.all([...CONFIG.photos, CONFIG.ancienLogo].map(src => new Promise(r => { const i = new Image(); i.onload = i.onerror = () => r(i); i.src = src; })))
    .then(([, , , , , old]) => { if (old.naturalWidth) ["oldLogo1", "oldLogo2"].forEach(id => $(id).appendChild(old.cloneNode())); });
}

/* ---------- Timeline ---------- */
function render(t) {
  camera(t); bars(t);

  // 1 — 2007 sur blanc, puis poussé vers le haut par le mur de photos
  const push = eInOut(seg(t, 2.75, 3.35));
  show($("s1"), t < 3.4);
  $("s1").style.transform = `translateY(${-push * 1920}px)`;
  { const p = eOutExpo(seg(t, .1, .8)), o = $("oldLogo1");
    o.style.opacity = p; o.style.transform = `translate(-50%,-50%) scale(${1.12 - .12 * p})`; o.style.filter = `blur(${(1 - p) * 10}px)`; }
  drop($("s1filet"), t, .9);
  words($("s1a"), t, .95);
  words($("s1b"), t, 1.35, Infinity, .045, .45);

  // 2 — mur de souvenirs : rangées qui défilent en sens alternés, accélération à chaque phrase
  show($("s2"), t >= 2.7 && t < 11.4);
  $("s2").style.transform = `translateY(${(1 - push) * 1920}px)`;
  let burst = 0; for (const h of PH_T.slice(1)) if (t > h) burst += 260 * (1 - Math.exp(-(t - h) * 5));
  for (let r = 0; r < ROWS; r++) {
    const dir = r % 2 ? 1 : -1, speed = 90 + (r % 3) * 25;
    const x = ((speed * t + burst + r * 173) % (PER * PITCH) + PER * PITCH) % (PER * PITCH);
    $("row" + r).style.transform = `translateX(${dir < 0 ? -x : x - PER * PITCH}px)`;
  }
  // le mur s'envole (zoom + fondu) pour révéler le « 20 »
  { const z = eInExpo(seg(t, 10.6, 11.35)); $("wall").style.transform = `scale(${1 + z * 2.2})`; $("wall").style.opacity = 1 - seg(t, 10.95, 11.35); }
  { const open = eOutExpo(seg(t, 3.3, 3.75)), close = eInOut(seg(t, 10.45, 10.8));
    $("band").style.transform = `scaleY(${open * (1 - close)})`; }
  drop($("s2filet"), t, 3.6);
  CONFIG.phrases.forEach((_, i) => {
    const a = PH_T[i], b = i < PH_T.length - 1 ? PH_T[i + 1] - .3 : 10.2;
    words($("word" + i), t, a + .15, b, .06, .45);
  });

  // 3 — « 20 » rempli de photos qui défilent à l'intérieur des chiffres
  show($("s3"), t >= 10.5 && t < 15.75);
  { const p = eOutExpo(seg(t, 10.95, 11.5)), n = $("num20");
    n.style.opacity = seg(t, 10.95, 11.1); n.style.transform = `scale(${1.35 - .35 * p})`; n.style.filter = `blur(${(1 - p) * 8}px)`;
    const k = Math.max(0, Math.floor((t - 11.0) / .42)), ph = [4, 0, 3, 2, 1][k % 5];
    n.style.backgroundImage = url(ph);
    n.style.backgroundPosition = `${50 + 8 * Math.sin(t * 1.3)}% 50%`;
    $("s3").style.transform = `scale(${1 + .18 * eIn(seg(t, 15.05, 15.7))})`; }
  drop($("s3filet"), t, 12.35);
  words($("s3a"), t, 12.4, Infinity, .12, .5);
  words($("s3b"), t, 13.4, Infinity, .05, .45);

  // 4 — iris blanc depuis le « 0 », ancien logo éjecté, filet d'or qui tombe et devient le nouveau logo
  show($("s4"), t >= 15.05 && t < 21.45);
  { const r = eInOut(seg(t, 15.05, 15.65)) * 2300; $("s4").style.clipPath = `circle(${r}px at 742px 650px)`; }
  { const p = eOutExpo(seg(t, 15.3, 15.9)), q = eInExpo(seg(t, 16.45, 16.8)), o = $("oldLogo2");
    show(o, t < 16.8);
    o.style.opacity = p; o.style.transform = `translate(calc(-50% - ${q * 1300}px),-50%) scale(${1.08 - .08 * p})`; o.style.filter = `blur(${q * 14}px)`; }
  { const g = $("goldLine"), d = eOutExpo(seg(t, 16.55, 16.9)), s = eInOut(seg(t, 16.95, 17.35));
    show(g, t >= 16.55 && t < 17.4);
    g.style.top = lerp(0, 645, s) + "px"; g.style.height = lerp(1920, 439, s) + "px";
    g.style.transform = `scaleY(${d})`; }
  show($("logoA"), t >= 17.3);
  assembleLogo($("logoA"), t, 16.9);
  words($("s4txt"), t, 18.75, Infinity, .07, .45);

  // 5 — le groupement demeure (photo convention) et un réseau se lance (photo de groupe)
  show($("s5"), t >= 21.3 && t < 26.4);
  words($("s5a"), t, 21.45, Infinity, .09, .5);
  { const o = eOutExpo(seg(t, 21.85, 22.5)); $("s5photo").style.clipPath = `inset(0 ${50 * (1 - o)}% 0 ${50 * (1 - o)}%)`;
    const second = t >= 23.45, a = second ? 23.45 : 21.85;
    $("s5img").style.backgroundImage = url(second ? CONFIG.reseau.photoB : CONFIG.reseau.photoA);
    $("s5img").style.transform = `scale(${1.12 - .1 * eOut(seg(t, a, a + 2.5))})`; }
  words($("s5b"), t, 23.4, Infinity, .1, .5);

  // 6 — carton de fin
  show($("s6"), t >= 26.3);
  assembleLogo($("logoB"), t, 26.5, .8);
  { const p = eOut(seg(t, 27.9, 28.7)); $("s6sign").style.opacity = p; $("s6sign").style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`; }
  words($("s6txt"), t, 28.4, Infinity, .05, .45);
  { const p = eOut(seg(t, 28.9, 29.4)); $("s6url").style.opacity = p; $("s6url").style.transform = `translateY(${(1 - p) * 20}px)`; }
}

/* ---------- Initialisation ---------- */
buildWall();
kin($("s1a"), CONFIG.ouverture.annee);
kin($("s1b"), CONFIG.ouverture.phrase);
kin($("s3a"), CONFIG.vingtAns.titre);
kin($("s3b"), CONFIG.vingtAns.suite);
kin($("s4txt"), CONFIG.identite);
kin($("s5a"), CONFIG.reseau.a);
kin($("s5b"), CONFIG.reseau.b);
kin($("s6txt"), CONFIG.finTexte);
$("s6url").textContent = CONFIG.siteWeb;
for (let i = 0; i < 5; i++) { const b = document.createElement("div"); b.className = "bar"; b.style.top = (i * 384) + "px"; b.style.height = "385px"; $("bars").appendChild(b); }

window.ready = Promise.all([
  ...["800", "700", "500"].map(w => document.fonts.load(`${w} 100px "Montserrat"`)),
  document.fonts.load('400 100px "Allison"'),
  preload(),
  ...[...document.querySelectorAll(".gni img")].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })),
]).then(() => document.fonts.ready);
window.render = render;

if (new URLSearchParams(location.search).has("render")) {
  document.body.classList.add("render");
} else {
  const fit = () => { const s = Math.min(innerWidth / 1080, (innerHeight - 60) / 1920); $("stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();
  let playing = true, t0 = performance.now(), cur = 0;
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "⏸" : "▶"; t0 = performance.now() - cur * 1000; };
  $("scrub").oninput = e => { cur = +e.target.value; t0 = performance.now() - cur * 1000; };
  window.ready.then(() => {
    const loop = now => {
      if (playing) { cur = ((now - t0) / 1000) % DURATION; $("scrub").value = cur; }
      $("tc").textContent = cur.toFixed(1) + " s"; render(cur); requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
